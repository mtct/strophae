name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not just the feature you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including workarounds you're using today.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        strophae is a single-user, local-first desktop app. Multi-user features
        (accounts, sharing, roles) are deliberately out of scope.
      options:
        - label: This fits a single-user, local-first desktop app.
          required: true
