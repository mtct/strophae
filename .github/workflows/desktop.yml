name: Desktop builds

# Electron desktop packages via Bun + electron-builder. Manual trigger, plus
# version tags — a `v*` tag also publishes the binaries as a GitHub release,
# which is what the landing page in docs/ links to.
#
# One architecture per platform, on purpose: macOS Apple Silicon (arm64) and
# Windows x64. The architectures themselves are pinned in electron-builder.yml,
# so a local build produces exactly what CI does. Store submission (Mac App
# Store pkg / Microsoft Store appx) needs the owner's certificates and
# identities — see PACKAGING.md.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's macos-latest runner is Apple Silicon, so arm64 builds native.
          # `-c.mac.identity=-` ad-hoc signs the app: arm64 macOS refuses to launch
          # a binary carrying no signature at all, and CI has no Developer ID.
          - os: macos-latest
            name: macOS arm64
            artifact: strophae-macos-arm64
            package: bunx electron-builder --mac --publish never -c.mac.identity=-
            path: |
              release/Strophae-macos-arm64.dmg
              release/Strophae-macos-arm64.zip
          - os: windows-latest
            name: Windows x64
            artifact: strophae-windows-x64
            package: bunx electron-builder --win --publish never
            path: |
              release/Strophae-windows-x64-setup.exe
              release/Strophae-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Bundle
        run: bun run build

      # No ELECTRON_RUN_AS_NODE override here: the runners never export it (only
      # the VSCode dev workspace does), and setting it to an empty string is not
      # neutral on Windows — Electron tests the variable with getenv_s, where an
      # empty value still reports a size, so the app would boot as bare Node.
      - name: Smoke-test the app
        run: bunx electron . --check

      - name: Package
        run: ${{ matrix.package }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Publish them on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh binaries
          # Re-running the workflow on an existing tag refreshes the assets
          # instead of failing on a release that is already there.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" binaries/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" binaries/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "strophae $TAG" \
              --generate-notes
          fi
